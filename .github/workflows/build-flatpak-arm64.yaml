name: Build chiaki-ng flatpak arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    name: Build chiaki-ng flatpak_arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          path: 'chiaki-ng'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          git \
          flatpak \
          flatpak-builder

      - name: Setup Flatpak Builder Environment
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install org.kde.Sdk//6.11 -y
          flatpak install org.kde.Platform//6.11 -y
          flatpak install io.qt.qtwebengine.BaseApp//6.11 -y
          flatpak update --appstream --assumeyes

      - name: Build Flatpak package
        working-directory: chiaki-ng
        run: |
          # build the checked-out commit, not the manifest's branch
          # and fetch it from this repository (works for forks too)
          sed -i 's|^        branch: main$|        commit: ${{ github.sha }}|' scripts/flatpak/io.github.andrasczeh.ChiakiNgVR.yaml
          sed -i 's|^        url: https://github.com/chiaki-ng/chiaki-ng.git$|        url: ${{ github.server_url }}/${{ github.repository }}.git|' scripts/flatpak/io.github.andrasczeh.ChiakiNgVR.yaml
          grep -q '^        commit: ${{ github.sha }}$' scripts/flatpak/io.github.andrasczeh.ChiakiNgVR.yaml
          grep -q '^        url: ${{ github.server_url }}/${{ github.repository }}.git$' scripts/flatpak/io.github.andrasczeh.ChiakiNgVR.yaml
          flatpak-builder --repo=chiaki-ng --force-clean build-dir scripts/flatpak/io.github.andrasczeh.ChiakiNgVR.yaml

      - name: Bundle Flatpak app
        working-directory: chiaki-ng
        run: |
          flatpak build-bundle chiaki-ng chiaki-ng-vr-arm64.flatpak io.github.andrasczeh.ChiakiNgVR --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          flatpak build-bundle chiaki-ng --runtime chiaki-ng-vr-arm64-debug.flatpak io.github.andrasczeh.ChiakiNgVR.Debug --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-vr-arm64.flatpak
          path: chiaki-ng/chiaki-ng-vr-arm64.flatpak
          if-no-files-found: error
          retention-days: 7
      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-vr-arm64-debug.flatpak
          path: chiaki-ng/chiaki-ng-vr-arm64-debug.flatpak
          if-no-files-found: error
          retention-days: 7
